name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A superseded deploy is worth cancelling; a deploy already publishing is not. Pages accepts one
# deployment at a time, so an in-progress publish has to finish rather than be interrupted.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Verification lives in its own job so the deploy job holds `pages: write` and nothing else does.
  # It repeats CI's stack rather than trusting CI's separate run: both are triggered by the same push
  # and run in parallel, so a red CI cannot stop a deploy that never waited for it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Install Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium

      - name: Run Chromium end-to-end tests
        run: npm run test:e2e -- --workers=1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `workflow_dispatch` accepts any ref carrying this file, so the push trigger's branch filter is
    # not the whole guard: without this, dispatching from a feature branch would publish it live.
    # Guarding the deploy rather than the build means a dispatch from elsewhere still runs the
    # verification stack — useful — and then skips publishing instead of failing.
    if: github.ref == 'refs/heads/main'

    # Scoped here, not at the top of the file: the verification job must not be able to publish.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
