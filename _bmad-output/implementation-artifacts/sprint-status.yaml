  4-2-thermal-drift-investigation-tutorial: done  # reviewed 2026-08-20 — three parallel layers, 45 raw findings -> 4 decisions (all resolved by Alexis), 31 patches applied, 3 deferred, 6 DISMISSED. THE STORY'S HARD PARTS HELD, and were verified rather than read: the artwork lookup is exhaustive (a third ExperimentModelId is TS2739), hasOpticalGeometry survives only in docstrings, Young's tableau moved byte-for-byte, AC10's 1.5.0 + record clause + sw.js v14 landed in one commit, and D2's premise is TRUE against source (validateCaseRecordForDefinition compares experimentModelVersion with unconditional equality in both walks and refuses the whole record, so declining the bump saved every returning player's investigation). Six dismissals, two of which looked severe: the tableau's rotation is NOT stale on first paint (tableau.render runs before paintLight), missing-replication does NOT shadow consult-no-limitation into unreachability (a test constructs the replicated state and drives the full four-rule ladder), and the bath ring's === is float-safe because normalizeControlValue snaps through integer scaling. WHAT THE REVIEW FOUND WAS ONE DEFECT CLASS, REPEATEDLY: a comment asserting a guarantee the code does not make, sixth story running. The apparatus-notes panel dropped overflowing authored prose under a comment saying the case was 'reported rather than swallowed' — both branches were the same statement and nothing was reported anywhere; it now raises a bilingual notice and a section heading can no longer paint over the only way out. The lamp-glow docstring and its guard computed 62+17=79px against STONE_RADIUS 84 while paintLight scales the glow 1.9x for every lit frame, so it reaches 94.3 and spills onto the bath. The mirror bound measured hypot(ARM_LENGTH, MIRROR_HALF_WIDTH)=69.6 while the painter draws the corner at 74.5, so MIRROR_THICKNESS 5->20 put a bar off the stone at every angle with the row green. Four docstrings named test files that do not exist (InterferometerGeometry.test.ts) or do not hold the assertion, and two cited CaseRecordSchema line numbers already 30 lines stale. NINE ASSERTIONS COULD NOT FAIL: three restated their own const definitions (Math.max(a,...)>=a, x*(a-a)===0, hypot(armEndPoint-centre)===ARM_LENGTH), one compared PUBLISHED_RESIDUAL_BOUND to its own definition (a THIRD expect(x).toBe(x) in the story that reports removing two), 'classifies every unit the two shipped cases actually author' read no shipped case, the ring test never left the window so a <2 tolerance passed, and two bath rows indexed ofKind('graphics')[0] — the exact habit the same diff added setName to abolish. NOTHING coupled the model constants to the 1907 transcription though two docstrings said MorleyMillerPrototype.test.ts did. The French note-line floor was 12 against 18 real lines under a comment describing 20 (Young authors two assumptions, not three) — now derived from the authored content. travelPhase01 is declared cyclic and read as progress, working only on a 200ms margin nothing recorded. ALEXIS'S FOUR CALLS: keep the undisclosed fringe-colour change (wavelength-derived green -> fixed off-white, out of scope per Task 4 and recorded as 'verbatim, deliberately unchanged' in three places) and correct the three records; assert the amplitude alone, dropping the peak-to-peak row that claimed the opposite of its own comment (2*0.01=0.02 > 0.019125) and turned RED for the change that makes the model more honest; GIVE ENGLISH THE UNBREAKABLE SEPARATOR and re-baseline AC5's byte-identical fence — the story's own EN screenshot shows 'Bath temperature: 20.0' / '°C' split across lines, photographed and not noted; accept the exact null at 45°/135° and give the interferometer a declared resultDecimalPlaces so one dial travel stops reading 0 / 0.01 / 0.1 / 0.11 (Young declares none, so its readout is untouched). Also: the degree class was exact-codepoint equality, so U+00BA and U+02DA reprinted the '0 °' defect on content that parsed clean — now classified AND refused at load; MAX_SECTION_LINES gained the schema cap its docstring already claimed; setOrigin is now recorded by sceneSlice, because the interferometer's label non-overlap invariant rested on it and could not fail. case.json 1.6.0 (one French U+202F before °C) with its allowlist clause, sw.js v15, one change. Gates: typecheck clean, 1614 unit / 83 files (from 1604), 70 e2e, both builds, typecheck:tests 105/59 held (the story's cap is 106/60), ledger re-audited BLOCKED on the same two rows. TEN new mutation proofs, each broken, its named test observed red, and restored — plus one OLD proof corrected: recorded row 10 does not reproduce, because both shipped cases' significanceRule happens to name every authored control, so a re-derivation gives the same key. THE ONE OPEN LAYOUT QUESTION WAS SETTLED IN A BROWSER RATHER THAN DEFERRED. The story inserted 48px above the reference shelf in YOUNG's column on a docstring claim naming a test that does not exist (nothing anywhere read referenceShelfFloor, a hint length, or a shelf control count). Captured at 1280x720 in French from the same state — two observations at one arrangement, then a refused advance to raise the hint, which is what actually shows one (resolveAdvanceView: showsHint = stillRefused && hint) — in this build and in a baseline worktree at 771adca: ONE reference control here, TWO at the baseline. A real AC1 'unchanged for Young' regression at a length the shipped case authors, reachable by ordinary play, not a hypothetical. ACCEPTED on Alexis's call: the loss is transient (both controls return when the hint withdraws) and a reference stays reachable from the reading room, which is the shelf's own documented reason for yielding to the hint; the alternative was ~24px of tightening against ~23px needed, marginal by a pixel and on constants shared with the prototype. AC1's fourth clause amended, the measured cost recorded at NOTES_CONTROL_Y, and THE CAPTURE SPEC IS COMMITTED — the answer to the review's other AC9 finding, that this story's nine screenshots have no address and no spec left to re-take them with. Deferred with Story 4.3 as owner: Young's two unreachable consultations (dead by the identical argument this story applied to the prototype, and not carried across) and AC2's missing reference-shelf walk.
  4-3-morley-miller-bounded-conclusion-and-debrief: review  # dev complete 2026-08-21. D1 (option A) reworded conclude-ether-disproved.claim.en to an ALREADY-AUTHORED phrase ("once and for all"), so the phrase set and evaluatePeerReview are byte-identical and recomputation over any persisted draft is unchanged -- a stronger record-safety argument than SS4 anticipated, and option B was not needed. The authored peer-overreach rule now fires on the one claim it was written for (it matched NONE of the four), so calibrated-conclusion is withheld from a reviewed overclaim: NFR8 made executable. case.json 1.7.0 + its CaseRecordSchema allowlist clause + sw.js v16 in ONE commit, and what a returning 1.6.0 player loses (the highlighted card, not the investigation) is asserted rather than promised. D2 (option A) re-states the limitation requirement's real scope -- pre-choice draft -- with the overclaim refusal named as the post-choice mechanism; three mechanisms pinned to three states. AC1's third clause was WRONG about the mechanism and is corrected: validateCaseRecordForDefinition DOES recompute the recognition flags (:785-789, :800-804); what makes them safe is that deriveRecognition reads PERSISTED feedback rather than re-evaluating. THE PREMISE WAS PROVED RED BEFORE ANYTHING CHANGED: 7 failures on shipped content, including "expected true to be false" on calibrated-conclusion. Route: walkToDebrief takes a required caseId AND conclusionProposalId, pinTheSupport/closeTheCase exported, beat count from scenarioScript, and the stage seat from the PRODUCTION presentColleagueIds -- because SS7's table and my first helper were both wrong: the conclusion board stages by PROPOSAL order, so slot 3 is harriet-lowe here and nils-abrahamsen only in colleagues[]. The two coincide on Young, which is why it looked right. A BROWSER CAUGHT IT -- the captured pane came back with missing-evidence alone. Also corrected: morley-miller-prototype.spec.ts DID already reach Debrief by inlining the steps, on a conclusion selected by accident. THREE BANDS MEASURED IN A BROWSER, which is the new instrument: the unit harness cannot see text height, but Phaser's greedy wrap over measureText through the real font stack can. Debrief comparison band 129/152px -- it HOLDS the content, and the margin is the second title line the reserve budgets and the longest French title does not use, so nothing was authored down; cited-source rows 36/36px, exact. CASE_FILE_ISSUES_HEIGHT GREW 106 -> 120 (derived from CASE_FILE_ISSUES_LINES at the clamp floor): Morley-Miller's worst reachable pair is 6 French lines but YOUNG'S IS 8, so the shared band was sized to its shorter tenant and the validated case's pane shrank on a state ordinary play reaches. It was not visibly broken -- the frames show 8 complete lines -- because clamp compares Phaser's real ~1.2x line box while the reserve computes 1.35x: THE PANE WAS SURVIVING ON THE GAP BETWEEN TWO MULTIPLIERS. 136 was refused by caseFileContentFits (14px of headroom at 1024x768), so 120 is the most the panel affords and the guarantee is now stated. CaseFileGeometry's old bound (3 x 2 x lineHeight = 102, "three rules each two lines") was a line count nobody had measured. 6 by-eye frames at 1280x720 EN+FR with committed specs and printed output paths, INCLUDING Young's pane -- the frame that changed the outcome. AC6: consultation.requested is NO LONGER UNOWNED (CaseFilePresenter has dispatched it since 2.12; the carried note is stale). 18 deferred rows triaged -- 4 closed (279, 293, 294 by measurement, 311 by re-statement), 14 re-owned to Story 5.1 / Story 7.1 / four named spec stories; rows 229 and 263 found to be the SAME item recorded twice. 4 opened with owners: Young's conclusion-universal-optics has the IDENTICAL defect and is worse there (inquiry-recognition.spec.ts has been earning calibrated-conclusion on an undefendable Young draft since 2.11), the full authored issue set overflows even the grown reserve (unreachable by play), WALK_TO_DEBRIEF_COST_MS now covers two routes. debrief.sourceRefs' first id matches NO artifact -- the collision that row warned about has already happened. case-review artifact SS4 corrected: its "confirmed by eye" claim had no route when written, and is now made true. 9 mutation proofs, each red then green, restored from a working-tree snapshot rather than git (HEAD still holds 1.6.0); TWO of SS10's were UNREACHABLE behind a CaseDefinitionSchema load refusal and were re-proved against mutations that reach the assertion. Gates: typecheck clean, 1650 unit/85 files (from 1614/83), 83 e2e (from 70), both builds ok, typecheck:tests 105/59 UNCHANGED (4 of my own were introduced and fixed). Young's case.json untouched, per SS1.  # story context created 2026-08-21 — Epic 4 closing story. Verified against source before writing: `peer-overreach` (10 authored phrases, EN+FR) matches NONE of this case's four conclusion claims, because the draft is always `proposal.claim.en` and `conclude-ether-disproved` says "has settled the matter for good" where the phrases say "settles it"/"once and for all"/"disproved" — so the authored overclaim refusal is unreachable, and `deriveRecognition` therefore awards "Calibrated conclusion recorded" to a player who concluded the ether is disproved (NFR8 forbids a reward for overclaiming by name). Every overreach assertion in the suite is a fixture rule containing its own fixture phrase; none reads a shipped case. The FR half of every phrase union is dead for the same `.en` reason. "Requires an explicit limitation" is satisfied by the authored string "None offered." because the requirement asks `.trim()`. No spec or screenshot has ever reached this case's debrief — `walkToDebrief` is hard-wired to Young and `pinTheSupport`/`closeTheCase` are module-private — so §4 of morley-miller-case-review.md claims a by-eye confirmation that had no route. Three bands are unmeasured: the debrief comparison band (margin exhausted at 289 FR chars), the case-file peer-review pane (106px shrink-then-crop holding 162-234 FR chars per issue, swept for NEITHER case), and the debrief source rows. 11 ACs, 10 tasks, two pre-implementation decisions with recommendations (D1 reword the claim over widening the phrase set — record-safe because recomputation reads the record's own text; D2 re-state the limitation requirement's real scope over a second persisted-recomputation seam). All 18 deferred-work items naming 4.3 triaged with a recommended owner each: 4 closed here, 14 re-owned (Story 5.1 for the record-recompute pair, Story 7.1 for Young's consultations, spec stories for campaign navigation, the wavelength seam, the print view and the shelf).
